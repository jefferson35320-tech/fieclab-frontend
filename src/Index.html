<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FiecLab | Gestão de Estoque e Vendas
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

</head>

<body>

    <header>

        <div class="logo">
            Fiec<span>Lab</span>
        </div>

        <div
            class="cart-icon-container"
            onclick="toggleCart()"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <span id="cart-count">
                0
            </span>

        </div>

    </header>

    <div class="container">

        <h2>
            Catálogo e Disponibilidade
        </h2>

        <div
            class="product-grid"
            id="catalog"
        >
        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
