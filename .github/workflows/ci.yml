name: CI Frontend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # Job 1: Build e teste da aplicação React
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Rodar Build do Projeto
        run: npm run build --if-present

  # Job 2: Construção e Push da Imagem Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: build-react
    # Garante que o push para o Docker Hub só ocorra em pushes diretos (evita em Pull Requests)
    if: github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: docker build -t fiecpa2026 .

      - name: Tag e Push da Imagem
        run: |
          docker tag fiecpa2026 ${{ secrets.DOCKER_USERNAME }}/fiecpa2026:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fiecpa2026:latest

  # Job 3: Implantação no servidor (AWS EC2)
  deploy-ec2:
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push'
    steps:
      - name: Forçar Pull da imagem nova
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/fiecpa2026:latest

      - name: Parar e remover container antigo
        run: |
          docker stop react-app || true
          docker rm react-app || true

      - name: Rodar novo container
        run: |
          docker run -d --name react-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/fiecpa2026:latest
